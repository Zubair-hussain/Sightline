<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'">
  <title>Sightline</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="global-nav" role="banner">
    <a class="brand" href="#" data-go="home" aria-label="Sightline home">
      <img src="assets/logo.svg" alt="" aria-hidden="true">
      <span>Sightline</span>
    </a>
    <nav aria-label="Main">
      <button data-go="home" data-i18n="nav.audit">Audit</button>
      <button data-go="history" data-i18n="nav.history">History</button>
      <button data-go="settings" data-i18n="nav.settings">Settings</button>
    </nav>
  </header>
  <div class="sub-nav" id="subnav" hidden>
    <div class="title" id="subnav-title"></div>
    <div class="links" id="subnav-links"></div>
    <div id="subnav-action"></div>
  </div>
  <main id="view" tabindex="-1"></main>
  <footer class="site-footer">
    <div class="inner">
      <div class="cols">
        <div>
          <h4>Sightline</h4>
          <button data-go="home" data-i18n="nav.audit">Audit</button>
          <button data-go="history" data-i18n="nav.history">History</button>
          <button data-go="settings" data-i18n="nav.settings">Settings</button>
        </div>
        <div id="footer-cats"></div>
        <div>
          <h4 data-i18n="settings.language">Language</h4>
          <label class="sr-only" for="footer-lang">Language</label>
          <select id="footer-lang"></select>
        </div>
      </div>
      <div class="legal">
        <span data-i18n="footer.tagline">Website audits for Windows, macOS and Linux.</span>
        <span id="footer-version"></span>
      </div>
      <p class="muted" data-i18n="footer.disclaimer">Scores are heuristics.</p>
    </div>
  </footer>
  <script type="module" src="dist/app.js"></script>
</body>
</html>
