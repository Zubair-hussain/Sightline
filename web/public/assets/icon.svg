    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <circle cx="470" cy="470" r="230" fill="none" stroke="#3a3a3c" stroke-width="56"/>
  <circle cx="470" cy="470" r="230" fill="none" stroke="#2997ff" stroke-width="56" stroke-linecap="round"
