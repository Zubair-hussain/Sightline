name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Lighthouse scoring matches the published curves
        shell: bash
        run: |
          node -e "
          const L = require('./out/engine/lighthouse-score');
          for (const [m, c] of Object.entries(L.CURVES.mobile)) {
            const a = L.logNormalScore(c, c.p10), b = L.logNormalScore(c, c.median);
            if (Math.abs(a - 0.9) > 0.005 || Math.abs(b - 0.5) > 0.005) { console.error(m, a, b); process.exit(1); }
          }
          console.log('scoring OK');"

      - name: CLI audit + test plan (example.com)
        if: runner.os == 'Linux'
        run: |
          node out/cli/sightline.js example.com --modules seo,links,website --pages 2 --links 20 --json report.json --html report.html --test-cases test-plan.csv
          test -s report.json && test -s report.html && test -s test-plan.csv

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: sample-report
          path: |
            report.html
            test-plan.csv

  website:
    name: Website (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Routes, headers and SSRF protection
        run: |
          npm start -- -p 3000 & sleep 5
          curl -fsS localhost:3000/healthz
          curl -fsS localhost:3000/ | grep -q "Every detail"
          curl -fsS localhost:3000/app | grep -q "web-bridge.js"
          curl -fsS localhost:3000/robots.txt | grep -q "Disallow: /api/"
          curl -fsS localhost:3000/sitemap.xml | grep -q "<urlset"
          curl -fsS localhost:3000/llms.txt | grep -q "Sightline"
          curl -sI localhost:3000/ | grep -qi "x-frame-options: deny"
          for u in http://127.0.0.1 http://169.254.169.254 http://localhost http://10.0.0.1 "http://[::1]/"; do
            curl -s -X POST localhost:3000/api/audit -H 'content-type: application/json' -d "{\"url\":\"$u\"}" | grep -q Blocked || { echo "SSRF not blocked: $u"; exit 1; }
          done
          echo "Website checks OK"

  edge:
    name: Cloudflare frontend and custom router
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://sightline.example.com
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            deploy/cloudflare/package-lock.json
      - run: npm ci --prefix web
      - run: npm ci --prefix deploy/cloudflare
      - run: npm test --prefix deploy/cloudflare
      - run: npm run build --prefix deploy/cloudflare
      - run: npm run check --prefix deploy/cloudflare
      - name: API replica isolation and readiness
        shell: bash
        run: |
          SIGHTLINE_API_ONLY=1 SIGHTLINE_ORIGIN_SECRET=ci-test-key npm --prefix web start -- -p 3000 &
          for i in {1..30}; do curl -fsS localhost:3000/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/)" = 404
          test "$(curl -sL -o /dev/null -w '%{http_code}' localhost:3000/app/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/config)" = 401
          curl -fsS localhost:3000/healthz | grep -q sightline-api
          curl -s -X POST localhost:3000/api/audit -H 'content-type: application/json' -H 'x-sightline-origin-key: ci-test-key' -d '{"url":"http://127.0.0.1"}' | grep -q Blocked
