name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Lighthouse scoring matches the published curves
        shell: bash
        run: |
          node -e "
          const L = require('./out/engine/lighthouse-score');
          for (const [m, c] of Object.entries(L.CURVES.mobile)) {
            const a = L.logNormalScore(c, c.p10), b = L.logNormalScore(c, c.median);
            if (Math.abs(a - 0.9) > 0.005 || Math.abs(b - 0.5) > 0.005) { console.error(m, a, b); process.exit(1); }
          }
          console.log('scoring OK');"

      - name: CLI audit + test plan (example.com)
        if: runner.os == 'Linux'
        run: |
          node out/cli/sightline.js example.com --modules seo,links,website --pages 2 --links 20 --json report.json --html report.html --test-cases test-plan.csv
          test -s report.json && test -s report.html && test -s test-plan.csv

      - name: Web server health and SSRF protection
        if: runner.os == 'Linux'
        run: |
          node out/server/server.js & sleep 2
          curl -fsS localhost:8080/healthz
          curl -fsS localhost:8080/ | grep -q "Every detail"
          for u in http://127.0.0.1 http://169.254.169.254 http://localhost http://10.0.0.1; do
            curl -s -X POST localhost:8080/api/audit -H 'content-type: application/json' -d "{\"url\":\"$u\"}" | grep -q Blocked || { echo "SSRF not blocked: $u"; exit 1; }
          done
          echo "SSRF protection OK"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: sample-report
          path: |
            report.html
            test-plan.csv
