<!-- Adapted from registry item vfx-iphone-device: real GLTF iPhone 15 Pro + MacBook Pro.
     Screens are painted with plain canvas 2D (real iPhone audit screenshot; live Sightline report). -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #070f2e; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #070f2e; font-family: Inter, sans-serif; }
      #dv-cap { position: absolute; left: 0; right: 0; top: 96px; text-align: center; color: #fff; font-size: 84px; font-weight: 700; letter-spacing: -0.035em; z-index: 5; }
      #dv-cap span { display: inline-block; }
      #dv-cap .acc { color: #2997ff; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="devices" data-width="1920" data-height="1080" data-start="0" data-duration="7.01">
      <canvas id="theater" width="1920" height="1080" style="position:absolute;top:0;left:0;width:1920px;height:1080px"></canvas>
      <div id="dv-cap"><span id="dv-c1">Ten audits.</span> <span id="dv-c2" class="acc">One report.</span></div>
      <div id="dv-driver" class="clip" data-start="0" data-duration="7.01" data-track-index="0" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      var W = 1920, H = 1080, PI = Math.PI;
      var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("theater"), antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.setClearColor(0x070f2e, 1);
      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070f2e);
      var camera = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);

      // environment for reflections
      var eC = document.createElement("canvas"); eC.width = 1024; eC.height = 512;
      var ec = eC.getContext("2d");
      var eg = ec.createLinearGradient(0, 0, 1024, 512);
      eg.addColorStop(0, "#020307"); eg.addColorStop(0.15, "#1a2a5e"); eg.addColorStop(0.3, "#ffffff");
      eg.addColorStop(0.45, "#0a1a3e"); eg.addColorStop(0.6, "#ffffff"); eg.addColorStop(0.75, "#1e1e4e"); eg.addColorStop(1, "#020307");
      ec.fillStyle = eg; ec.fillRect(0, 0, 1024, 512);
      var eT = new THREE.CanvasTexture(eC); eT.mapping = THREE.EquirectangularReflectionMapping;
      var pm = new THREE.PMREMGenerator(renderer);
      scene.environment = pm.fromEquirectangular(eT).texture; eT.dispose(); pm.dispose();

      // deep blue → violet stage (reference 2)
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(22, 14), new THREE.ShaderMaterial({
        vertexShader: "varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
        fragmentShader: "varying vec2 v;void main(){vec3 c=vec3(0.008,0.014,0.05);c+=vec3(0.0,0.2,0.55)*exp(-pow(length((v-vec2(0.42,0.52))*vec2(1.6,1.0)),2.0)*28.0);c+=vec3(0.32,0.14,0.6)*exp(-pow(length((v-vec2(0.6,0.58))*vec2(1.6,1.0)),2.0)*30.0);gl_FragColor=vec4(c,1.0);}",
        depthWrite: false,
      }))).position.z = -6;
      var floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.5, roughness: 0.4, envMapIntensity: 0.05 }));
      floor.rotation.x = -PI / 2; floor.position.y = -2.5; scene.add(floor);
      scene.add(new THREE.AmbientLight(0x223355, 0.6));
      var kL = new THREE.DirectionalLight(0xffffff, 2.2); kL.position.set(-3, 4, 5); scene.add(kL);
      var rL = new THREE.PointLight(0x2997ff, 3, 15); rL.position.set(4, 2, 3); scene.add(rL);
      var wL = new THREE.PointLight(0x9d8cff, 1.6, 12); wL.position.set(-3, -1, 4); scene.add(wL);

      // ── screen textures (plain canvas 2D) ──
      var phoneCvs = document.createElement("canvas"); phoneCvs.width = 780; phoneCvs.height = 1688;
      var pctx = phoneCvs.getContext("2d");
      var lapCvs = document.createElement("canvas"); lapCvs.width = 1440; lapCvs.height = 900;
      var lctx = lapCvs.getContext("2d");
      function tex(c) { var t = new THREE.CanvasTexture(c); t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter; t.generateMipmaps = false; t.encoding = THREE.sRGBEncoding; return t; }
      var phoneTex = tex(phoneCvs), lapTex = tex(lapCvs);

      // real data from the audit of the Sightline website
      var CATS = [["Lighthouse", 81], ["SEO", 81], ["Performance", 100], ["Code coverage", 36], ["iPhone & iPad", 83],
        ["Memory leaks", 100], ["Website health", 66], ["Links", 65], ["Hreflang", null], ["Cloudflare & DNS", 50]];
      function band(v) { return v == null ? "#8e8e93" : v >= 90 ? "#30d158" : v >= 50 ? "#ff9f0a" : "#ff453a"; }
      function ring(ctx, x, y, r, w, value, frac) {
        ctx.lineCap = "round"; ctx.lineWidth = w;
        ctx.strokeStyle = "#3a3a3c"; ctx.beginPath(); ctx.arc(x, y, r, 0, PI * 2); ctx.stroke();
        if (value != null && frac > 0) { ctx.strokeStyle = band(value); ctx.beginPath(); ctx.arc(x, y, r, -PI / 2, -PI / 2 + PI * 2 * (value / 100) * frac); ctx.stroke(); }
      }
      function drawLaptop(p) {
        var c = lctx;
        c.fillStyle = "#0b0b0f"; c.fillRect(0, 0, 1440, 900);
        c.fillStyle = "#000"; c.fillRect(0, 0, 1440, 56);
        c.fillStyle = "#fff"; c.font = "600 22px Inter, sans-serif"; c.fillText("Sightline", 70, 36);
        c.fillStyle = "rgba(255,255,255,.7)"; c.font = "16px Inter, sans-serif"; c.fillText("Audit     History     Settings", 210, 35);
        c.fillStyle = "#2997ff"; c.beginPath(); c.arc(44, 28, 12, 0, PI * 2); c.fill();
        // hero
        ring(c, 190, 220, 92, 16, 77, p.overall);
        c.fillStyle = "#fff"; c.font = "700 64px Inter, sans-serif"; c.textAlign = "center"; c.fillText(String(Math.round(77 * p.overall)), 190, 242);
        c.textAlign = "left"; c.fillStyle = "#98989d"; c.font = "500 22px Inter, sans-serif"; c.fillText("Overall score", 330, 170);
        c.fillStyle = "#fff"; c.font = "700 44px Inter, sans-serif"; c.fillText("Sightline — Free website audit", 330, 222);
        c.fillStyle = "#2997ff"; c.font = "22px Inter, sans-serif"; c.fillText("10 audits · 38 launch-day test cases", 330, 262);
        // category grid
        for (var i = 0; i < CATS.length; i++) {
          var col = i % 5, row = Math.floor(i / 5);
          var x = 70 + col * 266, y = 380 + row * 250;
          var a = Math.max(0, Math.min(1, p.cards * CATS.length - i));
          c.globalAlpha = a;
          c.fillStyle = "#1c1c1e"; roundRect(c, x, y + (1 - a) * 20, 240, 220, 22); c.fill();
          ring(c, x + 120, y + 92 + (1 - a) * 20, 52, 10, CATS[i][1], a);
          c.fillStyle = "#fff"; c.font = "700 36px Inter, sans-serif"; c.textAlign = "center";
          c.fillText(CATS[i][1] == null ? "—" : String(Math.round(CATS[i][1] * a)), x + 120, y + 105 + (1 - a) * 20);
          c.font = "600 21px Inter, sans-serif"; c.fillText(CATS[i][0], x + 120, y + 190 + (1 - a) * 20);
          c.textAlign = "left";
        }
        c.globalAlpha = 1;
        lapTex.needsUpdate = true;
      }
      function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

      var turntable = new THREE.Group(); scene.add(turntable);
      var phoneGrp = new THREE.Group(); turntable.add(phoneGrp);
      var lapGrp = new THREE.Group(); turntable.add(lapGrp);
      var ready = 0;
      var draco = new THREE.DRACOLoader(); draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");
      var loader = new THREE.GLTFLoader(); loader.setDRACOLoader(draco);

      function planarScreenUv(mesh) {
        var g = mesh.geometry; g.computeBoundingBox(); var bb = g.boundingBox, pos = g.attributes.position;
        var w = bb.max.x - bb.min.x || 1, h = bb.max.y - bb.min.y || 1, uv = new Float32Array(pos.count * 2);
        for (var i = 0; i < pos.count; i++) { uv[i * 2] = (pos.getX(i) - bb.min.x) / w; uv[i * 2 + 1] = (pos.getY(i) - bb.min.y) / h; }
        g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
      }
      function alignScreenToMinusZ(root, frontName, backName) {
        var front = root.getObjectByName(frontName), back = root.getObjectByName(backName);
        if (!front || !back) return;
        root.updateWorldMatrix(true, true);
        var fp = new THREE.Vector3(), bp = new THREE.Vector3(); front.getWorldPosition(fp); back.getWorldPosition(bp);
        if (fp.z > bp.z) root.rotation.y += Math.PI;
      }
      loader.load("models/iphone.glb", function (gltf) {
        var m = gltf.scene, box = new THREE.Box3().setFromObject(m), sz = box.getSize(new THREE.Vector3());
        m.scale.setScalar(3.2 / sz.y); box.setFromObject(m); m.position.sub(box.getCenter(new THREE.Vector3()));
        m.traverse(function (ch) { if (ch.isMesh && ch.name.indexOf("front-glass") === 0) { planarScreenUv(ch); ch.material = new THREE.MeshBasicMaterial({ map: phoneTex }); } });
        alignScreenToMinusZ(m, "front-glass", "rear-window");
        phoneGrp.add(m); if (++ready === 3) onReady();
      });
      loader.load("models/macbook.glb", function (gltf) {
        var m = gltf.scene, box = new THREE.Box3().setFromObject(m), sz = box.getSize(new THREE.Vector3());
        m.scale.setScalar(4.5 / Math.max(sz.x, sz.z)); box.setFromObject(m); m.position.sub(box.getCenter(new THREE.Vector3()));
        m.traverse(function (ch) { if (ch.isMesh && ch.name.replace(/\.\d+$/, "") === "display") { planarScreenUv(ch); ch.material = new THREE.MeshBasicMaterial({ map: lapTex }); } });
        lapGrp.add(m); if (++ready === 3) onReady();
      });
      var shot = new Image();
      shot.onload = function () { pctx.drawImage(shot, 0, 0, 780, 1688); phoneTex.needsUpdate = true; if (++ready === 3) onReady(); };
      shot.src = "assets/shot-iphone.jpg";

      function onReady() { render(); window.__timelines = window.__timelines || {}; window.__timelines["devices"] = tl; }

      function cbz(p1x, p1y, p2x, p2y) {
        var ax = 3 * p1x - 3 * p2x + 1, bx = 3 * p2x - 6 * p1x, cx = 3 * p1x, ay = 3 * p1y - 3 * p2y + 1, by = 3 * p2y - 6 * p1y, cy = 3 * p1y;
        return function (t) { var s = t; for (var i = 0; i < 12; i++) { var x = ((ax * s + bx) * s + cx) * s - t, dx = (3 * ax * s + 2 * bx) * s + cx; if (Math.abs(dx) < 1e-10) break; s -= x / dx; } s = Math.max(0, Math.min(1, s)); return ((ay * s + by) * s + cy) * s; };
      }
      var enterEase = cbz(0.16, 1.0, 0.3, 1.0), driftEase = cbz(0.45, 0.0, 0.15, 1.0), breatheEase = cbz(0.37, 0.0, 0.63, 1.0);

      var S = { phX: 0, phY: 0.05, phZ: 0.5, phRX: 0.02, phRY: PI, lpX: 9, lpY: -0.2, lpZ: -0.6, lpRY: -0.1,
        cX: 0, cY: 0.15, cZ: 4.2, clX: 0, clY: 0.05, turn: 0, overall: 0, cards: 0 };

      function render() {
        drawLaptop(S);
        phoneGrp.position.set(S.phX, S.phY, S.phZ); phoneGrp.rotation.set(S.phRX, S.phRY, 0);
        lapGrp.position.set(S.lpX, S.lpY, S.lpZ); lapGrp.rotation.set(0, S.lpRY, 0);
        turntable.rotation.y = S.turn;
        camera.position.set(S.cX, S.cY, S.cZ); camera.lookAt(S.clX, S.clY, 0);
        renderer.render(scene, camera);
      }

      var tl = gsap.timeline({ paused: true });
      // render after every child tween has applied this frame's state (a child onUpdate would run first and lag one seek)
      tl.eventCallback("onUpdate", render);
      tl.to({}, { duration: 7.01 }, 0);
      // Act 1 (0–2.3): iPhone front, camera pushes in on the real phone audit
      tl.to(S, { cZ: 2.9, duration: 1.8, ease: driftEase }, 0);
      tl.to(S, { phRY: PI + 0.12, phRX: 0.0, duration: 2.0, ease: breatheEase }, 0.1);
      // Act 2 (2.3–4.3): iPhone glides left and turns in; MacBook enters from the right; camera pulls back
      tl.to(S, { phX: -2.05, phZ: 0.6, phRY: PI + 0.35, duration: 1.8, ease: enterEase }, 2.3);
      tl.to(S, { lpX: 1.05, lpRY: -0.18, duration: 1.9, ease: enterEase }, 2.4);
      tl.to(S, { cZ: 6.9, cY: 1.1, clY: 0.5, cX: -0.35, clX: -0.35, duration: 2.0, ease: driftEase }, 2.3);
      // Act 3 (4.3–7): the report performs on the MacBook; slow orbit
      tl.to(S, { overall: 1, duration: 1.3, ease: driftEase }, 3.4);
      tl.to(S, { cards: 1, duration: 1.8, ease: breatheEase }, 3.7);
      tl.to(S, { turn: 0.22, duration: 2.6, ease: breatheEase }, 4.3);
      // caption
      tl.fromTo("#dv-c1", { opacity: 0, filter: "blur(12px)", y: 30 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "expo.out" }, 4.5);
      tl.fromTo("#dv-c2", { opacity: 0, filter: "blur(12px)", y: 30 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "expo.out" }, 4.68);
      tl.to("#dv-cap", { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 6.7);
    </script>
  </body>
</html>
