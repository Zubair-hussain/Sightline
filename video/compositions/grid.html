<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #ffffff; font-family: Inter, sans-serif; color: #000; }
    #gr-field { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .gr-d { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #000; }
    #gr-list { position: absolute; left: 1200px; top: 330px; }
    .gr-i { font-size: 52px; font-weight: 600; letter-spacing: -0.025em; line-height: 72px; color: #c7c7cc; }
    #gr-bul { position: absolute; left: -46px; top: 26px; width: 22px; height: 22px; border-radius: 50%; background: #000; }
    .gr-desc { position: absolute; left: 1200px; top: 790px; font-size: 34px; font-weight: 500; color: #3a3a3c; opacity: 0; white-space: nowrap; }
    #gr-end { position: absolute; left: 1200px; top: 790px; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; opacity: 0; }
    #gr-end .acc { color: #0066cc; }
  </style>
  <div id="root" data-composition-id="grid" data-width="1920" data-height="1080">
    <div id="gr-field"></div>
    <div id="gr-list">
      <div id="gr-bul"></div>
      <div class="gr-i" id="gr-i0">SEO</div>
      <div class="gr-i" id="gr-i1">Speed</div>
      <div class="gr-i" id="gr-i2">Links</div>
      <div class="gr-i" id="gr-i3">Memory</div>
      <div class="gr-i" id="gr-i4">Security</div>
      <div class="gr-i" id="gr-i5">iPhone &amp; iPad</div>
    </div>
    <div class="gr-desc" id="gr-d0">Can people find you on Google?</div>
    <div class="gr-desc" id="gr-d1">Scored the way Lighthouse does it.</div>
    <div class="gr-desc" id="gr-d2">Every broken link, found.</div>
    <div class="gr-desc" id="gr-d3">Memory leaks caught before launch.</div>
    <div class="gr-desc" id="gr-d4">HTTPS, headers and Cloudflare.</div>
    <div class="gr-desc" id="gr-d5">Tested on a real iPhone viewport.</div>
    <div id="gr-end">Ten audits. <span class="acc">One app.</span></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const B = 0.448;
    // circular dot field (deterministic: seeded LCG, no Math.random)
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const CX = 600, CY = 540, R = 380, SP = 36;
    const field = document.getElementById("gr-field");
    const D = [];
    for (let y = CY - R; y <= CY + R; y += SP) for (let x = CX - R; x <= CX + R; x += SP) {
      const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy);
      if (r > R) continue;
      const el = document.createElement("div"); el.className = "gr-d"; el.style.left = x + "px"; el.style.top = y + "px";
      field.appendChild(el);
      D.push({ el, dx, dy, r, a: Math.atan2(dy, dx), q: rnd(), c: rnd() });
    }
    const PAL = ["#0066cc", "#2997ff", "#8fd3ff", "#c9c2f0", "#0b2a55", "#000000", "#5ac8fa"];
    // sizes (px) for each pattern: 0 base, 1 SEO scatter, 2 Speed ring, 3 Links clusters, 4 Memory wave, 5 Security rim, 6 iPhone shape, 7 colour burst
    const small = 6, big = 18;
    const P = [
      (d) => small,
      (d) => (d.q < 0.22 ? big : small),
      (d) => (Math.abs(d.r - 190) < 20 ? big : small),
      (d) => (d.r < 50 || (d.r > 330 && Math.abs(Math.sin(d.a * 3)) < 0.12) ? big : small),
      (d) => (Math.abs(d.dy - Math.sin(d.dx / 70) * 90) < 22 ? big : small),
      (d) => (d.r > 335 ? big : small),
      (d) => (Math.abs(d.dx) < 120 && Math.abs(d.dy) < 220 && !(Math.abs(d.dx) < 84 && Math.abs(d.dy) < 184) ? big : small),
      (d) => 10 + d.q * 12,
    ];
    const S = D.map((d) => P.map((f) => f(d)));
    const st = { k: 0, intro: 0 };
    const draw = () => {
      const k = Math.min(7, Math.max(0, st.k)), i = Math.floor(k), f = k - i, j = Math.min(7, i + 1);
      D.forEach((d, n) => {
        const s = S[n][i] + (S[n][j] - S[n][i]) * f;
        const show = Math.max(0, Math.min(1, st.intro * 1.35 - d.r / R * 0.35)); // dots grow out from the centre
        d.el.style.transform = "scale(" + (s / 20) * show + ")";
        d.el.style.background = k > 6.15 ? PAL[Math.floor(d.c * PAL.length)] : "#000";
      });
    };
    tl.eventCallback("onUpdate", draw);
    draw();
    tl.to(st, { intro: 1, duration: B * 2, ease: "power2.out" }, 0);
    tl.fromTo("#gr-list", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, B);
    // one feature every two beats: the grid redraws, the bullet steps down, the line explains it
    for (let p = 1; p <= 6; p++) {
      const t = B * 2 * p;
      tl.to(st, { k: p, duration: 0.32, ease: "power3.out" }, t);
      tl.to("#gr-bul", { y: (p - 1) * 72, duration: 0.28, ease: "power3.out" }, t);
      tl.to("#gr-i" + (p - 1), { color: "#000", duration: 0.12 }, t);
      if (p > 1) tl.to("#gr-i" + (p - 2), { color: "#c7c7cc", duration: 0.12 }, t);
      tl.fromTo("#gr-d" + (p - 1), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "expo.out" }, t + 0.05);
      tl.to("#gr-d" + (p - 1), { opacity: 0, duration: 0.1 }, t + B * 2 - 0.1);
    }
    // finale: every dot lights up in the Sightline palette
    tl.to(st, { k: 7, duration: 0.45, ease: "back.out(1.6)" }, B * 14);
    tl.to(".gr-i", { color: "#000", duration: 0.15 }, B * 14);
    tl.fromTo("#gr-end", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, B * 14);
    window.__timelines["grid"] = tl;
  </script>
</template>
